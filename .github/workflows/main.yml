name: Run Discount Program

on:
  push:
    branches:
      - hotfix

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python File
        run: python discount.py
